[workspace]
members = [
    "apps/server",
    "crates/auth",
    "crates/core",
    "crates/storage",
    "crates/sync",
]
resolver = "2"

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.94"
license-file = "LICENSE"
authors = ["wadaxiyang"]
repository = "https://github.com/wadaxiyang/lvos"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[workspace.dependencies]
argon2 = "0.5.3"
axum = "0.8.9"
dotenvy = "0.15.7"
http-body-util = "0.1.5"
rusqlite = { version = "0.40.2", features = ["backup", "bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = ["limit", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "env-filter", "fmt"] }
unicode-casefold = "0.2.0"
unicode-normalization = "0.1.25"
unicode-script = "0.5.8"
uuid = { version = "1.24.0", features = ["serde", "v4"] }
