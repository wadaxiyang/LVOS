[workspace]
members = [
    "apps/desktop",
    "apps/server",
    "crates/auth",
    "crates/core",
    "crates/platform",
    "crates/storage",
    "crates/sync",
    "crates/translation",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license-file = "LICENSE"
authors = ["wadaxiyang"]
repository = "https://github.com/wadaxiyang/lvos"

[workspace.lints.rust]
# Slint's generated item-tree code contains its own tightly scoped unsafe blocks.
# `deny` keeps handwritten workspace code unsafe-free while allowing the generator's
# local `allow(unsafe_code)` annotation to take effect.
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[workspace.dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
argon2 = "0.5.3"
dotenvy = "0.15.7"
http-body-util = "0.1.5"
futures-util = "0.3.34"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
rusqlite = { version = "0.40.2", features = ["backup", "bundled"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
slint = { version = "1.17.1", default-features = false, features = ["backend-winit", "compat-1-2", "raw-window-handle-06", "renderer-femtovg", "std"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = ["limit", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "env-filter", "fmt"] }
unicode-casefold = "0.2.0"
unicode-normalization = "0.1.25"
unicode-script = "0.5.8"
uuid = { version = "1.24.0", features = ["serde", "v4", "v7"] }
