[workspace]
members = [
    "apps/desktop",
    "apps/server",
    "crates/auth",
    "crates/core",
    "crates/platform",
    "crates/storage",
    "crates/sync",
    "crates/translation",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license-file = "LICENSE"
authors = ["wadaxiyang"]
repository = "https://github.com/wadaxiyang/lvos"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[workspace.dependencies]
sha2 = "0.11.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "env-filter", "fmt"] }
unicode-casefold = "0.2.0"
unicode-normalization = "0.1.25"
unicode-script = "0.5.8"
