name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup show
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets --all-features --locked
      - name: Build desktop
        run: cargo build --locked -p lvos-agent -p lvos
      - name: Check isolated server-only graph
        shell: bash
        run: python3 scripts/check_server_only.py
      - name: Install Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Verify native engineering package without publishing
        shell: bash
        run: python3 scripts/check_native_package.py
      - name: Verify repository policy
        shell: bash
        run: |
          python3 -B -m unittest discover -s scripts -p "test_*.py"
          python3 scripts/check_repository_policy.py
          python3 scripts/check_workspace.py
          python3 scripts/check_kit_adoption.py
          python3 scripts/check_stage14_security.py
          python3 scripts/check_stage15_scope.py
