name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup show
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets --all-features
      - name: Verify repository policy
        shell: bash
        run: |
          python3 -B -m unittest scripts/test_ci_checks.py
          python3 scripts/check_repository_policy.py
          python3 scripts/check_workspace.py
          python3 scripts/check_stage14_security.py
          python3 scripts/check_stage15_scope.py
