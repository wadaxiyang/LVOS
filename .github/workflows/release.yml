name: Publish unsigned release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Verify Rust toolchain
        run: rustup show
      - name: Verify tag matches workspace version
        shell: bash
        run: python3 scripts/check_release_tag.py "${GITHUB_REF_NAME}"
      - name: Build and verify unsigned macOS arm64 DMG
        run: python3 scripts/check_native_package.py
      - uses: actions/upload-artifact@v7
        with:
          name: lvos-macos-arm64
          path: target/release-package/LVOS-*-macos-arm64.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - name: Verify Rust toolchain
        run: rustup show
      - name: Verify tag matches workspace version
        shell: pwsh
        run: python scripts/check_release_tag.py "$env:GITHUB_REF_NAME"
      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build and verify unsigned Windows x86_64 installer
        shell: pwsh
        run: python scripts/check_native_package.py
      - uses: actions/upload-artifact@v7
        with:
          name: lvos-windows-x86_64
          path: target/release-package/LVOS-*-windows-x86_64-setup.exe
          if-no-files-found: error

  release:
    needs: [macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: lvos-*
          path: artifacts
          merge-multiple: true
      - name: Generate strict update manifest and checksums
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 scripts/generate_update_manifest.py \
            --version "${version}" \
            --channel stable \
            --macos "artifacts/LVOS-${version}-macos-arm64.dmg" \
            --windows "artifacts/LVOS-${version}-windows-x86_64-setup.exe" \
            --output artifacts/lvos-update-stable.json
          python3 scripts/generate_release_checksums.py \
            --output artifacts/SHA256SUMS \
            "artifacts/LVOS-${version}-macos-arm64.dmg" \
            "artifacts/LVOS-${version}-windows-x86_64-setup.exe" \
            artifacts/lvos-update-stable.json
          python3 scripts/verify_release_candidate.py \
            --directory artifacts \
            --version "${version}"
      - name: Publish stable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            artifacts/LVOS-*.dmg \
            artifacts/LVOS-*-setup.exe \
            artifacts/lvos-update-stable.json \
            artifacts/SHA256SUMS \
            --latest \
            --verify-tag \
            --title "LVOS ${GITHUB_REF_NAME}" \
            --notes-file RELEASE.md
