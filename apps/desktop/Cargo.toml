[package]
name = "lvos"
build = "build.rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
lvos-auth = { path = "../../crates/auth" }
lvos-core = { path = "../../crates/core" }
lvos-platform = { path = "../../crates/platform" }
lvos-storage = { path = "../../crates/storage" }
lvos-sync = { path = "../../crates/sync" }
lvos-translation = { path = "../../crates/translation" }
slint.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSView", "NSWindow"] }
raw-window-handle = "0.6.2"

[dev-dependencies]
async-trait.workspace = true
tempfile = "3.27.0"

[build-dependencies]
slint-build = "1.17.1"

[lints]
workspace = true
