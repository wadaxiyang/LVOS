[package]
name = "lvos"
build = "build.rs"
autobins = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["ui"]
ui = [
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:quadrant-kit",
    "dep:raw-window-handle",
    "dep:rfd",
    "dep:slint",
    "dep:slint-build",
    "dep:windows",
    "dep:winresource",
]

[[bin]]
name = "lvos-ui"
path = "src/ui_process.rs"
required-features = ["ui"]

[dependencies]
async-trait.workspace = true
futures-util.workspace = true
lvos-auth = { path = "../../crates/auth" }
lvos-core = { path = "../../crates/core" }
lvos-ipc = { path = "../../crates/ipc" }
lvos-platform = { path = "../../crates/platform" }
lvos-storage = { path = "../../crates/storage" }
lvos-sync = { path = "../../crates/sync" }
lvos-translation = { path = "../../crates/translation" }
reqwest = { workspace = true, features = ["query", "stream"] }
rustls.workspace = true
secrecy.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
slint = { workspace = true, optional = true }
tokio = { workspace = true, features = ["io-util", "net"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.4", optional = true }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSView", "NSWindow"], optional = true }
raw-window-handle = { version = "0.6.2", optional = true }
rfd = { version = "0.17.2", default-features = false, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = { version = "0.6.2", optional = true }
rfd = { version = "0.17.2", default-features = false, optional = true }
windows = { version = "0.62.2", optional = true, features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
async-trait.workspace = true
axum.workspace = true
lvos-server = { path = "../server" }
tempfile = "3.27.0"

[build-dependencies]
slint-build = { version = "=1.17.1", optional = true }
quadrant-kit = { git = "https://github.com/wadaxiyang/Quadrant-Kit.git", rev = "20cc9d77b737d1326d4320a42f7d26f9a799298f", version = "=0.1.1", optional = true }

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = { version = "0.1", optional = true }

[lints]
workspace = true
